mcs.metadata:
  componentName: AgentFactory
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Agent Factory
    includeInOnSelectIntent: false
    triggerQueries:
      - Create an agent
      - Build me an agent
      - Agent factory
      - Generate agent
      - Make a new agent
      - Create a Copilot Studio agent
      - Build an agent from my connectors

  actions:
    # ── Step 1: Get session context ──

    - kind: BeginDialog
      id: beginDialog_sessionContext
      dialog: copilots_header_91a5e.action.GCFRESTConnector-Getsessioncontext
      output:
        binding:
          environmentId: Topic.environmentId
          hasDesignContext: Topic.hasDesignContext
          baseName: Topic.baseName

    # ── Step 1b: Get agent factory context (research-phase recommendations) ──

    - kind: BeginDialog
      id: beginDialog_agentContext
      dialog: copilots_header_91a5e.action.GCFRESTConnector-GetAgentContext
      output:
        binding:
          agentName: Topic.recAgentName
          agentPurpose: Topic.recAgentPurpose
          deployedConnectorCount: Topic.deployedConnectorCount
          hasDeployedConnectors: Topic.hasDeployedConnectors
          connectorSummariesJson: Topic.connectorSummariesJson
          recommendedMcpServers: Topic.recommendedMcpServers
          recommendedKnowledgeSourcesJson: Topic.recommendedKnowledgeSourcesJson
          includeCua: Topic.recIncludeCua

    # ── Step 2: Guard — require deployed connectors ──

    - kind: ConditionGroup
      id: condGroup_checkContext
      conditions:
        - id: cond_noContext
          condition: =!Topic.hasDesignContext
          actions:
            - kind: SendActivity
              id: sendActivity_noContext
              activity: |-
                ⚠️ **No design context found.**

                You need to deploy at least one custom connector before creating an agent.
                Use the **Connector Pipeline** (say "Build connectors") to deploy connectors first, then come back here.
            - kind: EndDialog
              id: endDialog_noContext

    # ── Step 3: Display Agent Composition Card ──

    - kind: AdaptiveCardPrompt
      id: adaptiveCard_agentComposition
      card: |-
        ={
          type: "AdaptiveCard",
          '$schema': "https://adaptivecards.io/schemas/adaptive-card.json",
          version: "1.5",
          body: [
            {
              type: "TextBlock",
              text: "🏭 Agent Factory",
              weight: "Bolder",
              size: "Large",
              wrap: true
            },
            {
              type: "TextBlock",
              text: "Create a new Copilot Studio agent from your deployed connectors, MCP servers, and knowledge sources.",
              wrap: true,
              spacing: "Small"
            },
            {
              type: "TextBlock",
              text: "Agent Name",
              weight: "Bolder",
              spacing: "Medium"
            },
            {
              type: "Input.Text",
              id: "agentName",
              placeholder: "Enter agent name",
              value: Coalesce(Topic.recAgentName, Topic.baseName, "My Custom Agent")
            },
            {
              type: "TextBlock",
              text: "Agent Purpose",
              weight: "Bolder"
            },
            {
              type: "Input.Text",
              id: "agentPurpose",
              placeholder: "Describe what this agent should do",
              isMultiline: true,
              value: Coalesce(Topic.recAgentPurpose, "")
            },

            {
              type: "ColumnSet",
              spacing: "Large",
              separator: true,
              selectAction: {
                type: "Action.ToggleVisibility",
                targetElements: ["d-connectors"]
              },
              columns: [
                {
                  type: "Column",
                  width: "stretch",
                  items: [
                    {
                      type: "TextBlock",
                      text: Concatenate("📦 Deployed Connectors (", Topic.deployedConnectorCount, ")"),
                      weight: "Bolder",
                      color: "Accent",
                      wrap: true
                    }
                  ]
                },
                {
                  type: "Column",
                  width: "auto",
                  verticalContentAlignment: "Center",
                  items: [
                    {type: "Icon", name: "ChevronDown", size: "Small", color: "Accent"}
                  ]
                }
              ]
            },
            {
              type: "Container",
              id: "d-connectors",
              isVisible: false,
              spacing: "None",
              items: If(
                IsBlank(Topic.connectorSummariesJson) Or Topic.connectorSummariesJson = "[]",
                [
                  {
                    type: "TextBlock",
                    text: "No connectors deployed yet.",
                    isSubtle: true,
                    wrap: true
                  }
                ],
                ForAll(
                  Table(ParseJSON(Topic.connectorSummariesJson)),
                  {
                    type: "ColumnSet",
                    spacing: "Small",
                    columns: [
                      { type: "Column", width: "auto", verticalContentAlignment: "Center", items: [{ type: "TextBlock", text: "✅" }] },
                      { type: "Column", width: "stretch", items: [{ type: "TextBlock", text: Concatenate(Text(Value.displayName), " — ", Text(Value.operationCount), " operations"), wrap: true }] }
                    ]
                  }
                )
              )
            },

            {
              type: "ColumnSet",
              spacing: "Small",
              separator: true,
              selectAction: {
                type: "Action.ToggleVisibility",
                targetElements: ["d-knowledge"]
              },
              columns: [
                {
                  type: "Column",
                  width: "stretch",
                  items: [
                    {
                      type: "TextBlock",
                      text: "🔌 Knowledge Sources (SharePoint)",
                      weight: "Bolder",
                      color: "Accent",
                      wrap: true
                    }
                  ]
                },
                {
                  type: "Column",
                  width: "auto",
                  verticalContentAlignment: "Center",
                  items: [
                    {type: "Icon", name: "ChevronDown", size: "Small", color: "Accent"}
                  ]
                }
              ]
            },
            {
              type: "Container",
              id: "d-knowledge",
              isVisible: false,
              spacing: "None",
              items: [
                {
                  type: "TextBlock",
                  text: "Add SharePoint site URLs as knowledge sources for the agent.",
                  wrap: true,
                  size: "Small",
                  isSubtle: true
                },
                {
                  type: "Input.Text",
                  id: "sharepointUrl1",
                  placeholder: "https://tenant.sharepoint.com/sites/..."
                },
                {
                  type: "Input.Text",
                  id: "sharepointUrl2",
                  placeholder: "Additional SharePoint URL (optional)"
                },
                {
                  type: "Input.Text",
                  id: "sharepointUrl3",
                  placeholder: "Additional SharePoint URL (optional)"
                }
              ]
            },

            {
              type: "ColumnSet",
              spacing: "Small",
              separator: true,
              selectAction: {
                type: "Action.ToggleVisibility",
                targetElements: ["d-mcp"]
              },
              columns: [
                {
                  type: "Column",
                  width: "stretch",
                  items: [
                    {
                      type: "TextBlock",
                      text: "🤖 MCP Servers",
                      weight: "Bolder",
                      color: "Accent",
                      wrap: true
                    }
                  ]
                },
                {
                  type: "Column",
                  width: "auto",
                  verticalContentAlignment: "Center",
                  items: [
                    {type: "Icon", name: "ChevronDown", size: "Small", color: "Accent"}
                  ]
                }
              ]
            },
            {
              type: "Container",
              id: "d-mcp",
              isVisible: false,
              spacing: "None",
              items: [
                {
                  type: "TextBlock",
                  text: If(!IsBlank(Topic.recommendedMcpServers), "Pre-selected based on research phase. Adjust as needed.", "Select Microsoft MCP servers to add as tools."),
                  wrap: true,
                  size: "Small",
                  isSubtle: true
                },
                {
                  type: "Input.Toggle",
                  id: "mcp_mslearn",
                  title: "Microsoft Learn Docs MCP",
                  value: If(And(!IsBlank(Topic.recommendedMcpServers), Find("ms-learn-docs", Topic.recommendedMcpServers) > 0), "true", "false")
                },
                {
                  type: "Input.Toggle",
                  id: "mcp_azure",
                  title: "Azure MCP Server",
                  value: If(And(!IsBlank(Topic.recommendedMcpServers), Find("azure", Topic.recommendedMcpServers) > 0), "true", "false")
                },
                {
                  type: "Input.Toggle",
                  id: "mcp_dataverse",
                  title: "Microsoft Dataverse MCP",
                  value: If(And(!IsBlank(Topic.recommendedMcpServers), Find("dataverse", Topic.recommendedMcpServers) > 0), "true", "false")
                },
                {
                  type: "Input.Toggle",
                  id: "mcp_m365",
                  title: "Microsoft 365 MCP",
                  value: If(And(!IsBlank(Topic.recommendedMcpServers), Find("m365", Topic.recommendedMcpServers) > 0), "true", "false")
                },
                {
                  type: "Input.Toggle",
                  id: "mcp_playwright",
                  title: "Playwright MCP (Browser Automation)",
                  value: If(And(!IsBlank(Topic.recommendedMcpServers), Find("playwright", Topic.recommendedMcpServers) > 0), "true", "false")
                }
              ]
            },

            {
              type: "ColumnSet",
              spacing: "Small",
              separator: true,
              selectAction: {
                type: "Action.ToggleVisibility",
                targetElements: ["d-options"]
              },
              columns: [
                {
                  type: "Column",
                  width: "stretch",
                  items: [
                    {
                      type: "TextBlock",
                      text: "⚙️ Additional Options",
                      weight: "Bolder",
                      color: "Accent",
                      wrap: true
                    }
                  ]
                },
                {
                  type: "Column",
                  width: "auto",
                  verticalContentAlignment: "Center",
                  items: [
                    {type: "Icon", name: "ChevronDown", size: "Small", color: "Accent"}
                  ]
                }
              ]
            },
            {
              type: "Container",
              id: "d-options",
              isVisible: false,
              spacing: "None",
              items: [
                {
                  type: "Input.Toggle",
                  id: "includeCua",
                  title: "Include Computer Use Agent capability",
                  value: If(Topic.recIncludeCua = "true", "true", "false")
                }
              ]
            }
          ],
          actions: [
            {
              type: "Action.Submit",
              title: "🚀 Create Agent"
            }
          ]
        }
      output:
        binding:
          actionSubmitId: Topic.cardActionId
          agentName: Topic.agentName
          agentPurpose: Topic.agentPurpose
          sharepointUrl1: Topic.sharepointUrl1
          sharepointUrl2: Topic.sharepointUrl2
          sharepointUrl3: Topic.sharepointUrl3
          mcp_mslearn: Topic.mcpMslearn
          mcp_azure: Topic.mcpAzure
          mcp_dataverse: Topic.mcpDataverse
          mcp_m365: Topic.mcpM365
          mcp_playwright: Topic.mcpPlaywright
          includeCua: Topic.includeCua

      outputType:
        properties:
          actionSubmitId: String
          agentName: String
          agentPurpose: String
          sharepointUrl1: String
          sharepointUrl2: String
          sharepointUrl3: String
          mcp_mslearn: String
          mcp_azure: String
          mcp_dataverse: String
          mcp_m365: String
          mcp_playwright: String
          includeCua: String

    # ── Step 4: Validate required fields ──

    - kind: ConditionGroup
      id: condGroup_validateName
      conditions:
        - id: cond_missingName
          condition: =IsBlank(Topic.agentName)
          actions:
            - kind: SendActivity
              id: sendActivity_missingName
              activity: "⚠️ Agent name is required. Please try again."
            - kind: EndDialog
              id: endDialog_missingName

    - kind: ConditionGroup
      id: condGroup_validatePurpose
      conditions:
        - id: cond_missingPurpose
          condition: =IsBlank(Topic.agentPurpose)
          actions:
            - kind: SendActivity
              id: sendActivity_missingPurpose
              activity: "⚠️ Agent purpose is required. Please try again."
            - kind: EndDialog
              id: endDialog_missingPurpose

    # ── Step 5: Build MCP server IDs string ──

    - kind: SetVariable
      id: setVar_mcpIds
      variable: Topic.mcpServerIds
      value: |-
        =Concatenate(
          If(Or(Topic.mcpMslearn = "true", Topic.mcpMslearn = "True"), "ms-learn-docs,", ""),
          If(Or(Topic.mcpAzure = "true", Topic.mcpAzure = "True"), "azure,", ""),
          If(Or(Topic.mcpDataverse = "true", Topic.mcpDataverse = "True"), "dataverse,", ""),
          If(Or(Topic.mcpM365 = "true", Topic.mcpM365 = "True"), "m365,", ""),
          If(Or(Topic.mcpPlaywright = "true", Topic.mcpPlaywright = "True"), "playwright,", "")
        )

    # ── Step 6: Build knowledge sources JSON ──

    - kind: SetVariable
      id: setVar_knowledgeSources
      variable: Topic.knowledgeSourcesJson
      value: |-
        =With(
          {
            sp1: If(!IsBlank(Topic.sharepointUrl1), Concatenate("{""type"":""sharepoint"",""url"":""", Topic.sharepointUrl1, """,""displayName"":""SharePoint Source 1"",""description"":""SharePoint knowledge source""}"), ""),
            sp2: If(!IsBlank(Topic.sharepointUrl2), Concatenate("{""type"":""sharepoint"",""url"":""", Topic.sharepointUrl2, """,""displayName"":""SharePoint Source 2"",""description"":""SharePoint knowledge source""}"), ""),
            sp3: If(!IsBlank(Topic.sharepointUrl3), Concatenate("{""type"":""sharepoint"",""url"":""", Topic.sharepointUrl3, """,""displayName"":""SharePoint Source 3"",""description"":""SharePoint knowledge source""}"), "")
          },
          Concatenate(
            "[",
            Concat(
              Filter(
                Table(
                  {v: sp1},
                  {v: sp2},
                  {v: sp3}
                ),
                !IsBlank(v)
              ),
              v,
              ","
            ),
            "]"
          )
        )

    # ── Step 7: Confirmation card ──

    - kind: SendActivity
      id: sendActivity_generating
      activity:
        attachments:
          - kind: AdaptiveCardTemplate
            cardContent: |-
              ={
                type: "AdaptiveCard",
                '$schema': "https://adaptivecards.io/schemas/adaptive-card.json",
                version: "1.5",
                body: [
                  {
                    type: "TextBlock",
                    text: "🏭 Generating Agent",
                    weight: "Bolder",
                    size: "Large",
                    wrap: true
                  },
                  {
                    type: "FactSet",
                    facts: [
                      { title: "Name", value: Topic.agentName },
                      { title: "Purpose", value: Topic.agentPurpose },
                      { title: "Connectors", value: "All deployed connectors included" },
                      { title: "Knowledge Sources", value: If(Or(IsBlank(Topic.knowledgeSourcesJson), Topic.knowledgeSourcesJson = "[]"), "None", Topic.knowledgeSourcesJson) },
                      { title: "MCP Servers", value: If(IsBlank(Topic.mcpServerIds), "None", Topic.mcpServerIds) },
                      { title: "CUA", value: If(Or(Topic.includeCua = "true", Topic.includeCua = "True"), "Yes", "No") }
                    ]
                  },
                  {
                    type: "TextBlock",
                    text: "⏳ This may take 30-60 seconds...",
                    wrap: true,
                    spacing: "Medium"
                  }
                ]
              }

    # ── Step 8: Call generate endpoint ──

    - kind: BeginDialog
      id: beginDialog_generateAgent
      input:
        binding:
          agentName: =Topic.agentName
          agentPurpose: =Topic.agentPurpose
          environmentId: =Topic.environmentId
          solutionName: ="GCFApps"
          mcpServerIds: =If(IsBlank(Topic.mcpServerIds), "none", Topic.mcpServerIds)
          knowledgeSourcesJson: =If(Or(IsBlank(Topic.knowledgeSourcesJson), Topic.knowledgeSourcesJson = "[]"), "[]", Topic.knowledgeSourcesJson)
          includeCua: =If(Or(Topic.includeCua = "true", Topic.includeCua = "True"), "true", "false")
          instructionsOverride: ="auto"
      dialog: copilots_header_91a5e.action.GCFRESTConnector-GenerateAgent
      output:
        binding:
          jobId: Topic.agentJobId
          status: Topic.agentJobStatus

    # ── Step 9: Poll for completion ──

    - kind: SendActivity
      id: sendActivity_polling
      activity: ⏳ Agent generation in progress, polling for status...

    - kind: BeginDialog
      id: beginDialog_pollStatus
      input:
        binding:
          jobId: =Topic.agentJobId
      dialog: copilots_header_91a5e.action.GCFRESTConnector-AgentGenerateStatus
      output:
        binding:
          status: Topic.pollStatus
          result: Topic.pollResult
          error: Topic.pollError

    # ── Step 10: Show result ──

    - kind: ConditionGroup
      id: condGroup_checkResult
      conditions:
        - id: cond_success
          condition: =Topic.pollStatus = "success"
          actions:
            - kind: SendActivity
              id: sendActivity_success
              activity: |
                ✅ **Agent created successfully!**

                {Topic.pollResult}

                **Next steps:**
                1. Open the agent in Copilot Studio
                2. Configure any connections that need authentication
                3. Publish the agent
                4. Test with sample prompts

        - id: cond_failed
          condition: =Topic.pollStatus = "failed"
          actions:
            - kind: SendActivity
              id: sendActivity_failed
              activity: |
                ❌ **Agent generation failed.**

                Error: {Topic.pollError}

                Please check the server logs and try again.

      elseActions:
        - kind: SendActivity
          id: sendActivity_stillRunning
          activity: ⏳ Agent is still generating. Please check back shortly or ask "Check agent generation status".
