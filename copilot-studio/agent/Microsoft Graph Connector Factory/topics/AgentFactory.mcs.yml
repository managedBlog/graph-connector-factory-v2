mcs.metadata:
  componentName: AgentFactory
kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    displayName: Agent Factory
    includeInOnSelectIntent: false
    triggerQueries:
      - Create an agent
      - Build me an agent
      - Agent factory
      - Generate agent
      - Make a new agent
      - Create a Copilot Studio agent
      - Build an agent from my connectors

  actions:
    # ── Step 1: Get session context ──

    - kind: BeginDialog
      id: beginDialog_sessionContext
      dialog: copilots_header_91a5e.action.GCFRESTConnector-Getsessioncontext
      output:
        binding:
          environmentId: Topic.environmentId
          hasDesignContext: Topic.hasDesignContext
          baseName: Topic.baseName

    # ── Step 1b: Get agent factory context (research-phase recommendations) ──

    - kind: BeginDialog
      id: beginDialog_agentContext
      dialog: copilots_header_91a5e.action.GCFRESTConnector-GetAgentContext
      output:
        binding:
          agentName: Topic.recAgentName
          agentPurpose: Topic.recAgentPurpose
          deployedConnectorCount: Topic.deployedConnectorCount
          hasDeployedConnectors: Topic.hasDeployedConnectors
          connectorSummariesJson: Topic.connectorSummariesJson
          recommendedMcpServers: Topic.recommendedMcpServers
          recommendedKnowledgeSourcesJson: Topic.recommendedKnowledgeSourcesJson
          recKsUrl1: Topic.recKsUrl1
          recKsUrl2: Topic.recKsUrl2
          recKsUrl3: Topic.recKsUrl3
          recKsName1: Topic.recKsName1
          recKsName2: Topic.recKsName2
          recKsName3: Topic.recKsName3

    # ── Step 2: Guard — require deployed connectors ──

    - kind: ConditionGroup
      id: condGroup_checkContext
      conditions:
        - id: cond_noContext
          condition: =!Topic.hasDesignContext
          actions:
            - kind: SendActivity
              id: sendActivity_noContext
              activity: |-
                ⚠️ **No design context found.**

                You need to deploy at least one custom connector before creating an agent.
                Use the **Connector Pipeline** (say "Build connectors") to deploy connectors first, then come back here.
            - kind: EndDialog
              id: endDialog_noContext

    # ── Step 3: Display Agent Composition Card ──

    - kind: AdaptiveCardPrompt
      id: adaptiveCard_agentComposition
      card: |-
        ={
          type: "AdaptiveCard",
          '$schema': "https://adaptivecards.io/schemas/adaptive-card.json",
          version: "1.5",
          body: [
            {
              type: "TextBlock",
              text: "🏭 Agent Factory",
              weight: "Bolder",
              size: "Large",
              wrap: true
            },
            {
              type: "TextBlock",
              text: "Create a new Copilot Studio agent from your deployed connectors, MCP servers, and knowledge sources.",
              wrap: true,
              spacing: "Small"
            },
            {
              type: "TextBlock",
              text: "Agent Name",
              weight: "Bolder",
              spacing: "Medium"
            },
            {
              type: "Input.Text",
              id: "agentName",
              placeholder: "Enter agent name",
              value: Coalesce(Topic.recAgentName, Topic.baseName, "My Custom Agent")
            },
            {
              type: "TextBlock",
              text: "Agent Purpose",
              weight: "Bolder"
            },
            {
              type: "Input.Text",
              id: "agentPurpose",
              placeholder: "Describe what this agent should do",
              isMultiline: true,
              value: Coalesce(Topic.recAgentPurpose, "")
            },

            {
              type: "ColumnSet",
              spacing: "Large",
              separator: true,
              selectAction: {
                type: "Action.ToggleVisibility",
                targetElements: ["d-connectors"]
              },
              columns: [
                {
                  type: "Column",
                  width: "stretch",
                  items: [
                    {
                      type: "TextBlock",
                      text: Concatenate("📦 Deployed Connectors (", Topic.deployedConnectorCount, ")"),
                      weight: "Bolder",
                      color: "Accent",
                      wrap: true
                    }
                  ]
                },
                {
                  type: "Column",
                  width: "auto",
                  verticalContentAlignment: "Center",
                  items: [
                    {type: "Icon", name: "ChevronDown", size: "Small", color: "Accent"}
                  ]
                }
              ]
            },
            {
              type: "Container",
              id: "d-connectors",
              isVisible: false,
              spacing: "None",
              items: If(
                IsBlank(Topic.connectorSummariesJson) Or Topic.connectorSummariesJson = "[]",
                [
                  {
                    type: "TextBlock",
                    text: "No connectors deployed yet.",
                    isSubtle: true,
                    wrap: true
                  }
                ],
                ForAll(
                  Table(ParseJSON(Topic.connectorSummariesJson)),
                  {
                    type: "ColumnSet",
                    spacing: "Small",
                    columns: [
                      { type: "Column", width: "auto", verticalContentAlignment: "Center", items: [{ type: "TextBlock", text: "✅" }] },
                      { type: "Column", width: "stretch", items: [{ type: "TextBlock", text: Concatenate(Text(Value.displayName), " — ", Text(Value.operationCount), " operations"), wrap: true }] }
                    ]
                  }
                )
              )
            },

            {
              type: "ColumnSet",
              spacing: "Small",
              separator: true,
              selectAction: {
                type: "Action.ToggleVisibility",
                targetElements: ["d-knowledge"]
              },
              columns: [
                {
                  type: "Column",
                  width: "stretch",
                  items: [
                    {
                      type: "TextBlock",
                      text: "🔌 Knowledge Sources (SharePoint)",
                      weight: "Bolder",
                      color: "Accent",
                      wrap: true
                    }
                  ]
                },
                {
                  type: "Column",
                  width: "auto",
                  verticalContentAlignment: "Center",
                  items: [
                    {type: "Icon", name: "ChevronDown", size: "Small", color: "Accent"}
                  ]
                }
              ]
            },
            {
              type: "Container",
              id: "d-knowledge",
              isVisible: false,
              spacing: "None",
              items: [
                {
                  type: "TextBlock",
                  text: "Add SharePoint site URLs as knowledge sources for the agent.",
                  wrap: true,
                  size: "Small",
                  isSubtle: true
                },
                {
                  type: "TextBlock",
                  text: "Source 1",
                  weight: "Bolder",
                  size: "Small",
                  spacing: "Medium"
                },
                {
                  type: "Input.Text",
                  id: "sharepointName1",
                  placeholder: "Name (optional — derived from URL if blank)",
                  value: =Coalesce(Topic.recKsName1, "")
                },
                {
                  type: "Input.Text",
                  id: "sharepointUrl1",
                  placeholder: "https://tenant.sharepoint.com/sites/...",
                  value: =Coalesce(Topic.recKsUrl1, "")
                },
                {
                  type: "TextBlock",
                  text: "Source 2 (optional)",
                  weight: "Bolder",
                  size: "Small",
                  spacing: "Medium"
                },
                {
                  type: "Input.Text",
                  id: "sharepointName2",
                  placeholder: "Name (optional)",
                  value: =Coalesce(Topic.recKsName2, "")
                },
                {
                  type: "Input.Text",
                  id: "sharepointUrl2",
                  placeholder: "https://tenant.sharepoint.com/sites/...",
                  value: =Coalesce(Topic.recKsUrl2, "")
                },
                {
                  type: "TextBlock",
                  text: "Source 3 (optional)",
                  weight: "Bolder",
                  size: "Small",
                  spacing: "Medium"
                },
                {
                  type: "Input.Text",
                  id: "sharepointName3",
                  placeholder: "Name (optional)",
                  value: =Coalesce(Topic.recKsName3, "")
                },
                {
                  type: "Input.Text",
                  id: "sharepointUrl3",
                  placeholder: "https://tenant.sharepoint.com/sites/...",
                  value: =Coalesce(Topic.recKsUrl3, "")
                }
              ]
            },

            {
              type: "ColumnSet",
              spacing: "Small",
              separator: true,
              selectAction: {
                type: "Action.ToggleVisibility",
                targetElements: ["d-mcp"]
              },
              columns: [
                {
                  type: "Column",
                  width: "stretch",
                  items: [
                    {
                      type: "TextBlock",
                      text: "🤖 MCP Servers",
                      weight: "Bolder",
                      color: "Accent",
                      wrap: true
                    }
                  ]
                },
                {
                  type: "Column",
                  width: "auto",
                  verticalContentAlignment: "Center",
                  items: [
                    {type: "Icon", name: "ChevronDown", size: "Small", color: "Accent"}
                  ]
                }
              ]
            },
            {
              type: "Container",
              id: "d-mcp",
              isVisible: false,
              spacing: "None",
              items: [
                {
                  type: "TextBlock",
                  text: If(!IsBlank(Topic.recommendedMcpServers), "Pre-selected based on research phase. Adjust as needed.", "Select MCP servers to add as agent tools."),
                  wrap: true,
                  size: "Small",
                  isSubtle: true
                },
                {
                  type: "Input.Toggle",
                  id: "mcp_mslearn",
                  title: "📚 Microsoft Learn Docs MCP",
                  value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",ms-learn-docs,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                  spacing: "Small"
                },
                {
                  type: "Input.Toggle",
                  id: "mcp_sentinel",
                  title: "🛡️ Microsoft Sentinel MCP",
                  value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",sentinel,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                  spacing: "Small"
                },
                {
                  type: "Input.Toggle",
                  id: "mcp_m365admin",
                  title: "⚙️ Microsoft 365 Admin Center MCP",
                  value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",m365-admin,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                  spacing: "Small"
                },
                {
                  type: "Input.Toggle",
                  id: "mcp_fabriciq",
                  title: "📊 Fabric IQ Ontology MCP",
                  value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",fabric-iq,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                  spacing: "Small"
                },
                {
                  type: "ColumnSet",
                  spacing: "Medium",
                  selectAction: {
                    type: "Action.ToggleVisibility",
                    targetElements: ["d-workiq"]
                  },
                  columns: [
                    {
                      type: "Column",
                      width: "stretch",
                      items: [
                        {
                          type: "TextBlock",
                          text: "📧 Work IQ — M365 (Preview)",
                          weight: "Bolder",
                          size: "Small",
                          color: "Accent"
                        }
                      ]
                    },
                    {
                      type: "Column",
                      width: "auto",
                      verticalContentAlignment: "Center",
                      items: [
                        {type: "Icon", name: "ChevronDown", size: "xxSmall", color: "Accent"}
                      ]
                    }
                  ]
                },
                {
                  type: "Container",
                  id: "d-workiq",
                  isVisible: false,
                  spacing: "None",
                  items: [
                    {
                      type: "TextBlock",
                      text: "Work IQ servers provide M365 productivity tools. These features are in preview.",
                      wrap: true,
                      size: "Small",
                      isSubtle: true
                    },
                    {
                      type: "Input.Toggle",
                      id: "mcp_workiq_mail",
                      title: "Mail (Outlook)",
                      value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",workiq-mail,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                      spacing: "Small"
                    },
                    {
                      type: "Input.Toggle",
                      id: "mcp_workiq_calendar",
                      title: "Calendar (Outlook)",
                      value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",workiq-calendar,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                      spacing: "Small"
                    },
                    {
                      type: "Input.Toggle",
                      id: "mcp_workiq_teams",
                      title: "Teams",
                      value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",workiq-teams,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                      spacing: "Small"
                    },
                    {
                      type: "Input.Toggle",
                      id: "mcp_workiq_word",
                      title: "Word",
                      value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",workiq-word,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                      spacing: "Small"
                    },
                    {
                      type: "Input.Toggle",
                      id: "mcp_workiq_user",
                      title: "User (Profile & Presence)",
                      value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",workiq-user,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                      spacing: "Small"
                    },
                    {
                      type: "Input.Toggle",
                      id: "mcp_workiq_copilot",
                      title: "Copilot Search",
                      value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",workiq-copilot,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                      spacing: "Small"
                    },
                    {
                      type: "Input.Toggle",
                      id: "mcp_workiq_onedrive",
                      title: "OneDrive",
                      value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",workiq-onedrive,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                      spacing: "Small"
                    },
                    {
                      type: "Input.Toggle",
                      id: "mcp_workiq_sharepoint",
                      title: "SharePoint",
                      value: If(And(!IsBlank(Topic.recommendedMcpServers), Find(",workiq-sharepoint,", Concatenate(",", Topic.recommendedMcpServers, ",")) > 0), "true", "false"),
                      spacing: "Small"
                    }
                  ]
                }
              ]
            }
          ],
          actions: [
            {
              type: "Action.Submit",
              title: "🚀 Create Agent"
            }
          ]
        }
      output:
        binding:
          actionSubmitId: Topic.cardActionId
          agentName: Topic.agentName
          agentPurpose: Topic.agentPurpose
          sharepointName1: Topic.sharepointName1
          sharepointName2: Topic.sharepointName2
          sharepointName3: Topic.sharepointName3
          sharepointUrl1: Topic.sharepointUrl1
          sharepointUrl2: Topic.sharepointUrl2
          sharepointUrl3: Topic.sharepointUrl3
          mcp_mslearn: Topic.mcpMslearn
          mcp_sentinel: Topic.mcpSentinel
          mcp_m365admin: Topic.mcpM365Admin
          mcp_fabriciq: Topic.mcpFabricIq
          mcp_workiq_mail: Topic.mcpWorkiqMail
          mcp_workiq_calendar: Topic.mcpWorkiqCalendar
          mcp_workiq_teams: Topic.mcpWorkiqTeams
          mcp_workiq_word: Topic.mcpWorkiqWord
          mcp_workiq_user: Topic.mcpWorkiqUser
          mcp_workiq_copilot: Topic.mcpWorkiqCopilot
          mcp_workiq_onedrive: Topic.mcpWorkiqOnedrive
          mcp_workiq_sharepoint: Topic.mcpWorkiqSharepoint

      outputType:
        properties:
          actionSubmitId: String
          agentName: String
          agentPurpose: String
          sharepointName1: String
          sharepointName2: String
          sharepointName3: String
          sharepointUrl1: String
          sharepointUrl2: String
          sharepointUrl3: String
          mcp_mslearn: String
          mcp_sentinel: String
          mcp_m365admin: String
          mcp_fabriciq: String
          mcp_workiq_mail: String
          mcp_workiq_calendar: String
          mcp_workiq_teams: String
          mcp_workiq_word: String
          mcp_workiq_user: String
          mcp_workiq_copilot: String
          mcp_workiq_onedrive: String
          mcp_workiq_sharepoint: String

    # ── Step 4: Validate required fields ──

    - kind: ConditionGroup
      id: condGroup_validateName
      conditions:
        - id: cond_missingName
          condition: =IsBlank(Topic.agentName)
          actions:
            - kind: SendActivity
              id: sendActivity_missingName
              activity: "⚠️ Agent name is required. Please try again."
            - kind: EndDialog
              id: endDialog_missingName

    - kind: ConditionGroup
      id: condGroup_validatePurpose
      conditions:
        - id: cond_missingPurpose
          condition: =IsBlank(Topic.agentPurpose)
          actions:
            - kind: SendActivity
              id: sendActivity_missingPurpose
              activity: "⚠️ Agent purpose is required. Please try again."
            - kind: EndDialog
              id: endDialog_missingPurpose

    # ── Step 5: Build MCP server IDs string ──

    - kind: SetVariable
      id: setVar_mcpIds
      variable: Topic.mcpServerIds
      value: |-
        =Concatenate(
          If(Or(Topic.mcpMslearn = "true", Topic.mcpMslearn = "True"), "ms-learn-docs,", ""),
          If(Or(Topic.mcpSentinel = "true", Topic.mcpSentinel = "True"), "sentinel,", ""),
          If(Or(Topic.mcpM365Admin = "true", Topic.mcpM365Admin = "True"), "m365-admin,", ""),
          If(Or(Topic.mcpFabricIq = "true", Topic.mcpFabricIq = "True"), "fabric-iq,", ""),
          If(Or(Topic.mcpWorkiqMail = "true", Topic.mcpWorkiqMail = "True"), "workiq-mail,", ""),
          If(Or(Topic.mcpWorkiqCalendar = "true", Topic.mcpWorkiqCalendar = "True"), "workiq-calendar,", ""),
          If(Or(Topic.mcpWorkiqTeams = "true", Topic.mcpWorkiqTeams = "True"), "workiq-teams,", ""),
          If(Or(Topic.mcpWorkiqWord = "true", Topic.mcpWorkiqWord = "True"), "workiq-word,", ""),
          If(Or(Topic.mcpWorkiqUser = "true", Topic.mcpWorkiqUser = "True"), "workiq-user,", ""),
          If(Or(Topic.mcpWorkiqCopilot = "true", Topic.mcpWorkiqCopilot = "True"), "workiq-copilot,", ""),
          If(Or(Topic.mcpWorkiqOnedrive = "true", Topic.mcpWorkiqOnedrive = "True"), "workiq-onedrive,", ""),
          If(Or(Topic.mcpWorkiqSharepoint = "true", Topic.mcpWorkiqSharepoint = "True"), "workiq-sharepoint,", "")
        )

    # ── Step 6: Build knowledge sources JSON ──

    - kind: SetVariable
      id: setVar_knowledgeSources
      variable: Topic.knowledgeSourcesJson
      value: |-
        =With(
          {
            sp1: If(!IsBlank(Topic.sharepointUrl1), Concatenate("{""type"":""sharepoint"",""url"":""", Topic.sharepointUrl1, """,""displayName"":""", If(!IsBlank(Topic.sharepointName1), Topic.sharepointName1, "SharePoint Source 1"), """,""description"":""SharePoint knowledge source""}"), ""),
            sp2: If(!IsBlank(Topic.sharepointUrl2), Concatenate("{""type"":""sharepoint"",""url"":""", Topic.sharepointUrl2, """,""displayName"":""", If(!IsBlank(Topic.sharepointName2), Topic.sharepointName2, "SharePoint Source 2"), """,""description"":""SharePoint knowledge source""}"), ""),
            sp3: If(!IsBlank(Topic.sharepointUrl3), Concatenate("{""type"":""sharepoint"",""url"":""", Topic.sharepointUrl3, """,""displayName"":""", If(!IsBlank(Topic.sharepointName3), Topic.sharepointName3, "SharePoint Source 3"), """,""description"":""SharePoint knowledge source""}"), "")
          },
          Concatenate(
            "[",
            Concat(
              Filter(
                Table(
                  {v: sp1},
                  {v: sp2},
                  {v: sp3}
                ),
                !IsBlank(v)
              ),
              v,
              ","
            ),
            "]"
          )
        )

    # ── Step 7: Confirmation card ──

    - kind: SendActivity
      id: sendActivity_generating
      activity:
        attachments:
          - kind: AdaptiveCardTemplate
            cardContent: |-
              ={
                type: "AdaptiveCard",
                '$schema': "https://adaptivecards.io/schemas/adaptive-card.json",
                version: "1.5",
                body: [
                  {
                    type: "TextBlock",
                    text: "🏭 Generating Agent",
                    weight: "Bolder",
                    size: "Large",
                    wrap: true
                  },
                  {
                    type: "FactSet",
                    facts: [
                      { title: "Name", value: Topic.agentName },
                      { title: "Purpose", value: Topic.agentPurpose },
                      { title: "Connectors", value: Concatenate(Topic.deployedConnectorCount, " deployed connector(s)") },
                      { title: "Knowledge Sources", value: If(Or(IsBlank(Topic.knowledgeSourcesJson), Topic.knowledgeSourcesJson = "[]"), "None", Concatenate(Text(CountRows(Filter(Table({u: Topic.sharepointUrl1}, {u: Topic.sharepointUrl2}, {u: Topic.sharepointUrl3}), !IsBlank(u)))), " SharePoint site(s)")) },
                      { title: "MCP Servers", value: If(IsBlank(Topic.mcpServerIds), "None", Topic.mcpServerIds) }
                    ]
                  },
                  {
                    type: "TextBlock",
                    text: "⏳ This may take 30-60 seconds...",
                    wrap: true,
                    spacing: "Medium"
                  }
                ]
              }

    # ── Step 8: Call generate endpoint ──

    - kind: BeginDialog
      id: beginDialog_generateAgent
      input:
        binding:
          agentName: =Topic.agentName
          agentPurpose: =Topic.agentPurpose
          environmentId: =Topic.environmentId
          solutionName: ="GCFApps"
          mcpServerIds: =If(IsBlank(Topic.mcpServerIds), "none", Topic.mcpServerIds)
          knowledgeSourcesJson: =If(Or(IsBlank(Topic.knowledgeSourcesJson), Topic.knowledgeSourcesJson = "[]"), "[]", Topic.knowledgeSourcesJson)
          instructionsOverride: ="auto"
      dialog: copilots_header_91a5e.action.GCFRESTConnector-GenerateAgent
      output:
        binding:
          jobId: Topic.agentJobId
          status: Topic.agentJobStatus

    # ── Step 9: Poll for completion ──

    - kind: SendActivity
      id: sendActivity_polling
      activity: ⏳ Agent generation in progress, polling for status...

    - kind: BeginDialog
      id: beginDialog_pollStatus
      input:
        binding:
          jobId: =Topic.agentJobId
      dialog: copilots_header_91a5e.action.GCFRESTConnector-AgentGenerateStatus
      output:
        binding:
          status: Topic.pollStatus
          result: Topic.pollResult
          error: Topic.pollError

    # ── Step 10: Show result ──

    - kind: ConditionGroup
      id: condGroup_checkResult
      conditions:
        - id: cond_success
          condition: =Topic.pollStatus = "success"
          actions:
            - kind: SendActivity
              id: sendActivity_success
              activity: |
                ✅ **Agent created successfully!**

                {Topic.pollResult}

                **Next steps:**
                1. Open the agent in Copilot Studio
                2. Configure any connections that need authentication
                3. Publish the agent
                4. Test with sample prompts

        - id: cond_failed
          condition: =Topic.pollStatus = "failed"
          actions:
            - kind: SendActivity
              id: sendActivity_failed
              activity: |
                ❌ **Agent generation failed.**

                Error: {Topic.pollError}

                Please check the server logs and try again.

      elseActions:
        - kind: SendActivity
          id: sendActivity_stillRunning
          activity: ⏳ Agent is still generating. Please check back shortly or ask "Check agent generation status".
