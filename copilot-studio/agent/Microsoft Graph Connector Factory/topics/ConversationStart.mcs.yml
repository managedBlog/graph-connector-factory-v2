mcs.metadata:
  componentName: ConversationStart
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: sendMessage_M0LuhV
      activity:
        text:
          - Welcome to Graph Connector Factory. Tell me what connector scenario you want to build, or say "start agent factory" to open the guided flow.
        speak:
          - Welcome to Graph Connector Factory. Ask to discover Graph APIs, design a connector, deploy a connector, or start agent factory.
        attachments:
          - kind: AdaptiveCardTemplate
            cardContent: |-
              {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                "type": "AdaptiveCard",
                "version": "1.5",
                "body": [
                  {
                    "type": "TextBlock",
                    "text": "Graph Connector Factory",
                    "weight": "Bolder",
                    "size": "Large",
                    "wrap": true
                  },
                  {
                    "type": "TextBlock",
                    "text": "I help IT pros and admins build Power Platform custom connectors from Microsoft Graph API endpoints.",
                    "wrap": true,
                    "spacing": "Small"
                  },
                  {
                    "type": "FactSet",
                    "facts": [
                      { "title": "Discover", "value": "Find Graph API endpoints for your scenario" },
                      { "title": "Build", "value": "Generate custom connector definitions (Swagger 2.0)" },
                      { "title": "Deploy", "value": "Deploy connectors to Power Platform" },
                      { "title": "Configure", "value": "Set up authentication and app registrations" }
                    ]
                  }
                ]
              }