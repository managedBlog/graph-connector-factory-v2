kind: TaskDialog
modelDisplayName: Poll deploy job status
modelDescription: Long-polls a deploy or batch-deploy job. Returns the current status and, when complete, the full result. If the job is still running, holds the request up to 25 seconds before returning the latest progress. Topic should loop on this until status is success, partial, or failed.
