  componentName: GCF REST Connector - Batch generate custom connectors
kind: TaskDialog
modelDisplayName: Batch generate custom connectors
modelDescription: Generate Power Platform custom connector Swagger files for multiple connector groups in a single call. Accepts a JSON string of groups (each with baseName and ops), generates each connector, publishes to Gist, and returns results as a JSON string for Parse value node consumption.
