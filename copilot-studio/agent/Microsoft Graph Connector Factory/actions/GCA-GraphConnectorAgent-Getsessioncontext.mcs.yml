modelDescription: "Returns the full session context including explored endpoints and design decisions captured via graph_setDesignContext. Flat response: all endpoint tracking fields plus all design context fields merged at top level. Used by the OperationSelection topic to pre-fill connector configuration (auth type, base name, environment, connector grouping, etc.)."
