  - propertyName: authType

  - propertyName: baseName

  - propertyName: baseNameSource

  - propertyName: connectorCount

  - propertyName: endpointCount

  - propertyName: endpoints

  - propertyName: endpointPath

  - propertyName: environmentId

  - propertyName: hasDesignContext

  - propertyName: latestEndpoint

  - propertyName: notes

  - propertyName: targetVersion

  - propertyName: connectorGroupsJson

  - propertyName: group1Json

  - propertyName: group2Json

  - propertyName: group3Json

  - propertyName: maxOperations

action:
  kind: InvokeConnectorTaskAction
  connectionReference: copilots_header_91a5e.shared_gca-20-2d-20deploy-20pipeline-5f251f982b189de9d-2501cc3075c9bd9f.2b47903cf48c4a4aa58a3d67d0da8fbf
