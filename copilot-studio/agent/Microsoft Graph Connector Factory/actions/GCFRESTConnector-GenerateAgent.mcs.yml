mcs.metadata:
  componentName: GCF REST Connector - Generate Agent
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: agentName
    name: Agent Name
    description: Display name for the new agent
    isRequired: true
  - kind: AutomaticTaskInput
    propertyName: agentPurpose
    name: Agent Purpose
    description: Brief description of what the agent does
    isRequired: true
  - kind: AutomaticTaskInput
    propertyName: environmentId
    name: Environment ID
    description: Power Platform environment ID to deploy to
    isRequired: true
  - kind: AutomaticTaskInput
    propertyName: solutionName
    name: Solution Name
    description: Target solution unique name
    isRequired: true
  - kind: AutomaticTaskInput
    propertyName: mcpServerIds
    name: MCP Server IDs
    description: Comma-separated MCP server catalog IDs or none
    isRequired: true
  - kind: AutomaticTaskInput
    propertyName: knowledgeSourcesJson
    name: Knowledge Sources JSON
    description: JSON array of knowledge sources with type url displayName description
    isRequired: true
  - kind: AutomaticTaskInput
    propertyName: instructionsOverride
    name: Instructions Override
    description: Custom instructions text or auto for auto-generated
    isRequired: true
  - kind: AutomaticTaskInput
    propertyName: runId
    name: Run ID
    description: Optional run ID used for strict isolation
    isRequired: false
modelDisplayName: Generate Agent
modelDescription: Generates and deploys a new Copilot Studio agent with the specified connectors, MCP servers, and knowledge sources. Returns a job ID for async polling.
outputs:
  - propertyName: jobId
  - propertyName: status
  - propertyName: retryAfter
action:
  kind: InvokeConnectorTaskAction
  connectionReference: copilots_header_91a5e.shared_new-5fgcf-20rest-20connector-5f251f982b189de9d2.3b64b1b7818145a59f83da81404dde8e
  connectionProperties:
    mode: Invoker
  operationId: agent_generateAgent
  inputType:
    properties:
      agentName:
        description: Display name for the new agent
        displayName: Agent Name
        isRequired: true
        type: String
      agentPurpose:
        description: Brief description of what the agent does
        displayName: Agent Purpose
        isRequired: true
        type: String
      environmentId:
        description: Power Platform environment ID
        displayName: Environment ID
        isRequired: true
        type: String
      solutionName:
        description: Target solution name
        displayName: Solution Name
        isRequired: true
        type: String
      mcpServerIds:
        description: Comma-separated MCP server catalog IDs or none
        displayName: MCP Server IDs
        isRequired: true
        type: String
      knowledgeSourcesJson:
        description: JSON array of knowledge source objects
        displayName: Knowledge Sources JSON
        isRequired: true
        type: String
      instructionsOverride:
        description: Custom instructions text or auto
        displayName: Instructions Override
        isRequired: true
        type: String
      runId:
        description: Optional run ID used for strict isolation
        displayName: Run ID
        isRequired: false
        type: String
outputMode: All
